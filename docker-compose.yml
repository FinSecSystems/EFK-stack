services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: logs-elasticsearch
    restart: always
    dns: ${DNS_IP_INTERNAL}
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://logs-elasticsearch:9200/_cluster/health?pretty | grep status | grep -q '\\(green\\|yellow\\)'"]
      interval: 5s
      timeout: 3s    
    external_links:
      - operations:dns
    env_file:
      - ./elasticsearch.env
    volumes:
      - ${DB_DIR}/logselasticsearch:/usr/share/elasticsearch/data
    # no published port: Elasticsearch has no security, only the Docker network reaches it (Kibana, Fluentd, the /es proxies of Dejavu and Elasticvue)
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.2
        aliases:
          - elasticsearch
    ulimits:
      memlock:
        soft: -1
        hard: -1

  dejavu:
    image: appbaseio/dejavu@sha256:9252eb473e1a43ec4a16c6194575a29226c6ea43e43142b0950ff6de255f2778  # pinned digest (was dejavu:latest; version unknown, 2026-10-18)
    container_name: logs-dejavu
    restart: ${RESTART}
    dns: ${DNS_IP_INTERNAL}
    external_links:
      - operations:dns
    depends_on:
      - elasticsearch
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.3
        aliases:
          - dejavu

  fluentd:
    build: ./fluentd
    image: registry.finsec.localdomain/fluentd
    container_name: logs-fluentd
    dns: ${DNS_IP_INTERNAL}
    restart: always
    external_links:
      - operations:dns
    depends_on:
      - elasticsearch
    environment:
      # first start on a new state volume only: READ_FROM_HEAD=false records the end of every existing container log instead of sending 2 GB of old lines
      READ_FROM_HEAD: ${READ_FROM_HEAD:-true}
    volumes:
      - ./fluentd/conf:/fluentd/etc
      - ./fluentd/plugins:/fluentd/plugins
      # Docker's json-file logs of all containers, read only; Fluentd tails them (no container depends on Fluentd)
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # position file and buffer: local volume, never NFS (a hung NAS must not hang Fluentd)
      - fluentd-state:/fluentd/state
    ports:
      - "${LOG_SERVER_IP}:24224:24224"
      - "${LOG_SERVER_IP}:24224:24224/udp"
      - "${LOG_SERVER_IP}:9880:9880"
      - "${LOG_SERVER_IP}:9880:9880/udp"
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.4
        aliases:
          - fluentd

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.1
    container_name: logs-kibana
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
    depends_on:
      - elasticsearch
      - fluentd
    environment:
      ELASTICSEARCH_URL: http://logs-elasticsearch:9200
    volumes:
      - ${DATA_DIR}/logs/kibana/:/usr/share/kibana/config/
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.5
        aliases:
          - kibana

  kibana-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: logs-kibana-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "http://logs-kibana-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    depends_on:
      - kibana
      - fluentd
    environment:
      VIRTUAL_HOST: logs.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./kibana-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.6

  dejavu-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: logs-dejavu-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - dejavu
      - fluentd
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "http://logs-dejavu-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: dejavu.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./dejavu-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.7

  elasticvue:
    image: cars10/elasticvue@sha256:337b192ccad1c2ee4013ecf37643417787f94ab4acc527591bf60884b459aafb  # pinned digest (was untagged; 1.27.4-alpine, 2026-10-18)
    container_name: logs-elasticvue
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    environment:
      # preset cluster: the browser reaches Elasticsearch through the /es proxy of elasticvue-nginx.conf
      ELASTICVUE_CLUSTERS: '[{"name": "logs", "uri": "https://elastic.logs.finsec.localdomain/es"}]'
    external_links:
      - operations:dns
    depends_on:
      - elasticsearch
      - fluentd
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.8
        
  elasticvue-proxy-internal:
    image: registry.finsec.localdomain/proxy-nginx
    container_name: logs-elasticvue-proxy-internal
    dns: ${DNS_IP_INTERNAL}
    restart: ${RESTART}
    depends_on:
      - elasticvue
      - fluentd
    external_links:
      - operations:dns
      - operations:proxy
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "http://logs-elasticvue-proxy-internal"]
      interval: 300s
      timeout: 120s
      start_period: 100s
      retries: 5
    environment:
      VIRTUAL_HOST: elastic.logs.finsec.localdomain
      NETWORK_ACCESS: internal
    volumes:
      - ./elasticvue-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      operations_intranet:
        ipv4_address: 172.34.19.9

volumes:
  fluentd-state:

networks:
  operations_intranet:
    external: true
