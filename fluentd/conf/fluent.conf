# Fluentd for the Docker host. Containers keep Docker's default json-file log driver; Fluentd reads those log files (in_tail) and ships them to
# Elasticsearch, so no container depends on Fluentd being up (issue #17). Position file and buffer are on a local volume (/fluentd/state), never on NFS.
# Environment (defaults in brackets): ES_HOST [logs-elasticsearch], ES_PREFIX [docker] (the daily index is <prefix>-YYYYMMDD).

# every container's stdout/stderr, one file per container
<source>
  @type tail
  path /var/lib/docker/containers/*/*-json.log
  pos_file /fluentd/state/docker-containers.pos
  tag docker.*
  path_key tailed_path
  # Files that are not in the position file are read from their first line (containers created while Fluentd was down). The very first start on a new state
  # volume must therefore run once with READ_FROM_HEAD=false, which records the end of every existing log file instead of re-sending 2 GB of old logs.
  read_from_head "#{ENV['READ_FROM_HEAD'] || 'true'}"
  follow_inodes true
  refresh_interval 5
  rotate_wait 15
  <parse>
    @type json
    time_key time
    time_type string
    time_format %Y-%m-%dT%H:%M:%S.%N%z
  </parse>
</source>

# applications can still send events directly
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<source>
  @type http
  port 9880
  bind 0.0.0.0
</source>

# container_id, container_name, image, compose_project, compose_service
<filter docker.**>
  @type docker_meta
</filter>

# Fluentd's own log lines are read from its container's log file like any other container; do not also send the internal events
<label @FLUENT_LOG>
  <match fluent.**>
    @type null
  </match>
</label>

<match **>
  @type elasticsearch
  host "#{ENV['ES_HOST'] || 'logs-elasticsearch'}"
  port 9200
  logstash_format true
  logstash_prefix "#{ENV['ES_PREFIX'] || 'docker'}"
  logstash_dateformat %Y%m%d
  include_tag_key true
  tag_key @log_name
  suppress_type_name true
  # Elasticsearch 9 refuses requests without compatible Content-Type and Accept headers (HTTP 400 "Invalid media-type", issue #27).
  # content_type only accepts application/json and application/x-ndjson, so both headers are set through custom_headers.
  custom_headers {"Content-Type":"application/vnd.elasticsearch+x-ndjson; compatible-with=9","Accept":"application/vnd.elasticsearch+json; compatible-with=9"}
  # start even when Elasticsearch is not reachable yet (the buffer holds the events until it is)
  verify_es_version_at_startup false
  default_elasticsearch_version 9
  reconnect_on_error true
  reload_on_failure true
  request_timeout 30s
  <buffer>
    @type file
    path /fluentd/state/buffer
    flush_mode interval
    flush_interval 5s
    flush_thread_count 2
    chunk_limit_size 8MB
    total_limit_size 1GB
    overflow_action block         # when Elasticsearch is down and the buffer is full, reading slows down; the log files keep the lines meanwhile
    retry_type exponential_backoff
    retry_wait 2s
    retry_max_interval 60s
    retry_forever true
  </buffer>
</match>

<system>
  num_threads 2
</system>
